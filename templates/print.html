<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>वंशावली प्रिंट</title><style>@page{size:A4 landscape;margin:8mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#172033;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif}h1{text-align:center;margin:0 0 5px;font-size:14pt;line-height:1.3;color:#183b56;font-weight:700}.meta{text-align:center;margin:0 0 8px;font-size:10pt;color:#566575}.tree{position:relative;width:max-content;min-width:100%;padding:7mm 5mm 12mm}.tree-roots{display:flex;justify-content:center;align-items:flex-start;gap:25mm}.family-node{display:flex;flex-direction:column;align-items:center;position:relative;break-inside:avoid;page-break-inside:avoid}.person-wrap{display:flex;justify-content:center;align-items:center;position:relative;z-index:2}.children{display:flex;justify-content:center;align-items:flex-start;gap:10mm;margin-top:12mm;padding-top:8mm;position:relative;z-index:2}.card{position:relative;z-index:2;background:#fff;border:1.4px solid #355d78;border-radius:6px;padding:6px 9px;width:42mm;min-height:18mm;text-align:center;font-size:10pt;display:flex;flex-direction:column;align-items:center;justify-content:center;break-inside:avoid;page-break-inside:avoid;box-shadow:0 1px 3px #0001}.name{font-weight:bold;font-size:14pt;line-height:1.35;text-align:center;width:100%;overflow-wrap:anywhere}.small{font-size:10pt;line-height:1.3;margin-top:2px;text-align:center;width:100%;overflow-wrap:anywhere}.tree-connectors{position:absolute;left:0;top:0;z-index:1;overflow:visible;pointer-events:none;display:block}.tree-connectors path{fill:none;stroke:#56758d;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}@media print{.tree-connectors{display:block!important;visibility:visible!important}.tree-connectors path{stroke:#355d78!important;stroke-width:1.5!important;stroke-linecap:round!important;stroke-linejoin:round!important}.tree,.tree-roots,.family-node,.children,.person-wrap,.card{break-inside:avoid;page-break-inside:avoid}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><h1 id="title">वंशावली</h1><div id="meta" class="meta"></div><div id="tree" class="tree"></div><script>const NS='http://www.w3.org/2000/svg';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(p){return `<div class="card"><div class="name">${esc(p.name)}</div>${p.relation?`<div class="small">${esc(p.relation)}</div>`:''}${p.spouse_name?`<div class="small">पति/पत्नी: ${esc(p.spouse_name)}</div>`:''}</div>`}function nodeHtml(p,by,seen){if(seen.has(p.id))return '';seen.add(p.id);let children=(by[p.id]||[]).filter(c=>!seen.has(c.id));return `<div class="family-node" data-person-id="${p.id}"><div class="person-wrap" data-card-id="${p.id}">${card(p)}</div>${children.length?`<div class="children">${children.map(c=>nodeHtml(c,by,seen)).join('')}</div>`:''}</div>`}function draw(){let tree=document.getElementById('tree'),old=tree.querySelector('.tree-connectors');if(old)old.remove();let root=tree.querySelector('.tree-roots');if(!root)return;let tr=tree.getBoundingClientRect(),svg=document.createElementNS(NS,'svg');svg.classList.add('tree-connectors');let w=Math.max(tree.scrollWidth,tree.clientWidth),h=Math.max(tree.scrollHeight,tree.clientHeight);svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.style.width=w+'px';svg.style.height=h+'px';tree.querySelectorAll('.family-node').forEach(parent=>{let pc=parent.querySelector(':scope > .person-wrap .card'),children=parent.querySelector(':scope > .children');if(!pc||!children)return;let nodes=Array.from(children.children),pr=pc.getBoundingClientRect(),px=pr.left-tr.left+pr.width/2,py=pr.bottom-tr.top;let cr=nodes.map(n=>{let c=n.querySelector(':scope > .person-wrap .card');if(!c)return null;let r=c.getBoundingClientRect();return{x:r.left-tr.left+r.width/2,y:r.top-tr.top}}).filter(Boolean);if(!cr.length)return;let parentVertical=9;let childVertical=112;let joinY=py+parentVertical;let maxJoinY=Math.min(...cr.map(c=>c.y))-childVertical;if(joinY>maxJoinY)joinY=maxJoinY;let path=document.createElementNS(NS,'path'),d=`M ${px} ${py} V ${joinY}`;if(cr.length>1)d+=` M ${cr[0].x} ${joinY} H ${cr[cr.length-1].x}`;cr.forEach(c=>d+=` M ${c.x} ${joinY} V ${c.y}`);path.setAttribute('d',d);svg.appendChild(path)});tree.insertBefore(svg,tree.firstChild)}async function go(){let f=await (await fetch('/api/family')).json(),p=await (await fetch('/api/people')).json();document.getElementById('title').textContent=f.title||'वंशावली';document.getElementById('meta').textContent=[f.family_name,f.village,f.police_station,f.district,f.state].filter(Boolean).join(' • ');let by={};p.forEach(x=>(by[x.father_id||0]??=[]).push(x));let roots=p.filter(x=>!x.father_id);if(!roots.length)roots=p;let seen=new Set(),h='<div class="tree-roots">';roots.forEach(x=>h+=nodeHtml(x,by,seen));h+='</div>';let rest=p.filter(x=>!seen.has(x.id));if(rest.length)rest.forEach(x=>h+=nodeHtml(x,by,seen));document.getElementById('tree').innerHTML=h;requestAnimationFrame(()=>{draw();setTimeout(draw,100)});if(p.length)setTimeout(()=>window.print(),700)}go()</script></body></html>

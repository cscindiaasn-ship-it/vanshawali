<!doctype html><html lang="hi"><head><meta charset="utf-8"><title>वंशावली प्रिंट</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;margin:0;color:#111}h1{text-align:center;margin:0 0 4px;font-size:22px}.meta{text-align:center;margin-bottom:12px;font-size:12px}.tree{display:flex;flex-direction:column;align-items:center;gap:18px}.level{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.card{border:1px solid #222;border-radius:6px;padding:7px 12px;min-width:100px;text-align:center;font-size:12px}.name{font-weight:bold;font-size:14px}.small{font-size:10px}@media print{.level{break-inside:avoid}.card{break-inside:avoid}}</style></head><body><h1 id="title">वंशावली</h1><div id="meta" class="meta"></div><div id="tree" class="tree"></div><script>async function go(){let f=await (await fetch('/api/family')).json(),p=await (await fetch('/api/people')).json();document.getElementById('title').textContent=f.title||'वंशावली';document.getElementById('meta').textContent=[f.family_name,f.village,f.police_station,f.district,f.state].filter(Boolean).join(' • ');let by={};p.forEach(x=>(by[x.father_id||0]??=[]).push(x));let level=p.filter(x=>!x.father_id&&!x.mother_id);if(!level.length)level=p;let seen=new Set(),h='';for(let n=0;n<50&&level.length;n++){let cur=level.filter(x=>!seen.has(x.id));if(!cur.length)break;h+='<div class="level">'+cur.map(x=>`<div class="card"><div class="name">${x.name}</div>${x.relation?`<div class="small">${x.relation}</div>`:''}</div>`).join('')+'</div>';cur.forEach(x=>seen.add(x.id));let next=[];cur.forEach(x=>(by[x.id]||[]).forEach(c=>{if(!seen.has(c.id))next.push(c)}));level=next}document.getElementById('tree').innerHTML=h;p.length&&setTimeout(()=>window.print(),500)}go()</script></body></html>

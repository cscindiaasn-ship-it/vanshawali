<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>वंशावली Tree Builder</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>🌳 वंशावली Tree Builder</h1><div><button onclick="window.print()">🖨️ Print</button><a class="btn" href="/print" target="_blank">📄 Print Preview</a><button onclick="downloadBackup()">💾 Backup</button><label class="btn">↥ Restore <input id="restore" type="file" accept="application/json" hidden></label></div></header><main><aside><section><h2>परिवार की जानकारी</h2><input id="title" placeholder="शीर्षक"><input id="family_name" placeholder="परिवार / वंश का नाम"><input id="village" placeholder="गाँव"><input id="police_station" placeholder="थाना"><input id="district" placeholder="जिला"><input id="state" placeholder="राज्य"><button onclick="saveFamily()">सहेजें</button></section><section><h2>व्यक्ति जोड़ें</h2><input id="name" placeholder="नाम *"><input id="spouse_name" placeholder="पति / पत्नी"><input id="relation" placeholder="संबंध"><input id="birth_year" placeholder="जन्म वर्ष"><textarea id="notes" placeholder="टिप्पणी"></textarea><button onclick="addPerson()">+ व्यक्ति जोड़ें</button><button class="secondary" onclick="clearForm()">फॉर्म साफ करें</button></section><section><h2>खोज</h2><input id="search" placeholder="नाम खोजें..." oninput="render()"><button class="danger" onclick="resetAll()">सारा डेटा हटाएँ</button></section></aside><section class="canvas-wrap"><div id="tree" class="tree"></div></section></main><script src="/static/app.js"></script></body></html>
